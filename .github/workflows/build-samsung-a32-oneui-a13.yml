# v10 — v9a + inject ksu_handle_setresuid call in kernel/sys.c (manager APK detection)
#
# Drop this file into your fork of JackA1ltman/NonGKI_Kernel_Build_2nd at:
#     .github/workflows/build-samsung-a32-oneui-a13.yml
#
# Trigger from the Actions tab → "Build Samsung Galaxy A32 (OneUI A13)" → Run.

name: Build Samsung Galaxy A32 (OneUI A13)

on:
  workflow_call:
  workflow_dispatch:

env:
  # ---- Device --------------------------------------------------------------
  DEVICE_NAME     : "samsung_a32"
  DEVICE_CODENAME : "a32"

  # ---- Toolchain flags -----------------------------------------------------
  # SLM common is Linux 4.14.357. clang-r383902b is the same toolchain
  # referenced in SLM's build.config.mtk.aarch64 and matches Samsung's stock
  # build for the original .186 tree. ANDROID_MAJOR_VERSION=r still required.
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- ANDROID_MAJOR_VERSION=r KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y"
  EXTRA_CMDS  : "LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++"

  # ---- Kernel source -------------------------------------------------------
  # v3 base: SLMKernel (Knox stripped at source, KSU manual hooks pre-baked
  # in fs/exec.c / fs/stat.c / fs/open.c). 4.14.357 (vs stock .186) — strict
  # superset, ABI-stable across 4.14.x.
  KERNEL_SOURCE : "https://github.com/masarykadam/android_kernel_samsung_mt6768.git"
  # v8: v8-susfs adds Makefile EXTRAVERSION="" + CONFIG_LOCALVERSION="" on
  # top of v7-susfs (which has SUSFS v2.1.0 patches + fake-enforce). This
  # scrubs "-openela-vigus-slmkernel-a32" from UTS_RELEASE so /proc/version
  # reads "4.14.357" not "4.14.357-openela-vigus-slmkernel-a32".
  KERNEL_BRANCH : "v8-susfs"

  # ---- Toolchain downloads -------------------------------------------------
  CLANG_SOURCE  : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz"
  CLANG_BRANCH  : ""

  GCC_GNU       : true
  GCC_64_SOURCE : "https://github.com/nduykha/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.git"
  GCC_64_BRANCH : "main"
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  # ---- Defconfig -----------------------------------------------------------
  # a32_slm_defconfig already has CONFIG_KSU=y and ZERO RKP/KDP/UH/DEFEX.
  DEFCONFIG_SOURCE      : ""
  DEFCONFIG_NAME        : "a32_slm_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT   : false

  # ---- KSU fork: SukiSU-Ultra (builtin branch) ----------------------------
  # v8 lesson: ReSukiSU puts KSU_SUSFS in a Kconfig CHOICE block alongside
  # KSU_MANUAL_HOOK (mutually exclusive). The Kbuild treats KSU_SUSFS as
  # an alternative hook METHOD, not as an addon. Our SLM tree has manual
  # hooks pre-baked, so we cannot pick KSU_SUSFS without orphaning them.
  # Result: SUSFS Kconfig silently disabled → SUSFS dead in v8.
  #
  # v9 fix: switch to SukiSU-Ultra builtin branch. SukiSU-Ultra is the
  # parent of ReSukiSU (Dec 2025 fork). Its builtin Kconfig structures
  # KSU_SUSFS as an ADDON (no choice block) alongside KSU_MANUAL_HOOK,
  # the same way KSU-Next legacy-susfs does. Both selectable, both
  # default y → real SUSFS this time.
  #
  # The ReSukiSU manager APK is expected to work due to:
  #   (a) shared protocol ancestry with SukiSU-Ultra
  #   (b) CONFIG_KSU_MULTI_MANAGER_SUPPORT=y in our build
  # Fallback: SukiSU-Ultra manager (very similar UI).
  KERNELSU_SOURCE   : ""
  KERNELSU_BRANCH   : ""
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK: "sukisu"
  KERNELSU_METHOD   : "shell"

  # v7: SUSFS still enabled. SUSFS patches are pre-applied to the kernel
  # source (v7-susfs branch == v6-susfs). With SUSFS_ENABLE=true:
  # (a) framework adds CONFIG_KSU_SUSFS_* flags to defconfig
  # (b) grep fs/namespace.c, detect SUSFS already there, skip re-applying
  SUSFS_ENABLE      : true
  SUSFS_FIXED       : false

  # ---- Packaging (MTK can't boot raw Image -> MKBOOTIMG with stock ramdisk)-
  PACK_METHOD       : "MKBOOTIMG"

  # Re-upload stock_boot.img to a new "stock-boot" release on the SLM fork.
  # Source file: /Users/adammasaryk/Downloads/a32_kernel/tools/stock_boot.img
  BOOT_SOURCE       : "https://github.com/masarykadam/android_kernel_samsung_mt6768/releases/download/stock-boot/stock_boot.img"

  AK3_SOURCE        : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH        : "master"

  NEED_DTBO         : true
  NEED_SAFE_DTBO    : true

  ROM_TEXT          : "oneui_a13_v10"

  # ---- Misc ----------------------------------------------------------------
  PYTHON_VERSION    : "3"

  PACK_KMODULES     : "false"

  PATCHES_SOURCE    : "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH    : "samsung_kernel"
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED : ""

  REKERNEL_ENABLE   : "false"

  # SLM's KSU hook sites are manual (ksu_handle_execveat / stat / faccessat
  # already pre-patched in source). Tell the framework not to inject
  # syscall/kprobe variants.
  HOOK_METHOD       : "manual"

  KERNEL_PATCH      : "false"

  KPM_ENABLE        : "false"
  KPM_INLINE        : "false"
  KPM_KPATCH_NEXT   : "false"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT  : "false"

  HIDE_STUFF        : "false"

  GENERATE_DTB      : "false"
  GENERATE_CHIP     : "mediatek"

  # SKIP_PATCH=true short-circuits the SUSFS patch path entirely so the
  # framework can't trip on missing .rej fixups when SUSFS_ENABLE=false.
  BUILD_DEBUGGER    : "false"
  SKIP_PATCH        : "true"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE   : "true"

jobs:
  build-kernel:
    name: Samsung Galaxy A32 (OneUI A13)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR    : "true"
      CCACHE_HARDLINK     : "true"
      # v8 kernel banner spoof — mkcompile_h reads these from env to set
      # LINUX_COMPILE_BY, LINUX_COMPILE_HOST, UTS_VERSION used by
      # init/version.c → linux_banner → /proc/version.
      KBUILD_BUILD_USER     : "dpi"
      KBUILD_BUILD_HOST     : "21DND906"
      KBUILD_BUILD_TIMESTAMP: "Tue Feb 25 20:02:43 KST 2025"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      # Skipped: SLM tree has KSU manual hooks pre-baked in fs/exec.c, stat.c,
      # open.c. The framework's patch-no-kprobe action only accepts
      # HOOK_METHOD=kprobe|syscall and errors on "manual".
      # - name: Patch for no-kprobe
      #   uses: ./.github/workflows/patch-no-kprobe

      - name: Patch Hide Stuff
        if: env.HIDE_STUFF == 'true'
        uses: ./.github/workflows/patch-hide-stuff

      # SLM common ships CONFIG_DEBUG_INFO_BTF=y, which builds the host tool
      # tools/bpf/resolve_btfids. That tool requires libelf headers. Pahole is
      # used by the kernel's BTF generation pass.
      - name: Install BTF build deps
        run: sudo apt-get update && sudo apt-get install -y libelf-dev pahole

      # The framework's build-ready step runs clean_hook.sh, which strips all
      # pre-existing KSU hook lines from fs/* / drivers/* expecting a fresh
      # syscall/kprobe patch to be re-injected by patch-no-kprobe. We skip
      # patch-no-kprobe because SLM ships manual hooks, so we restore them
      # from the upstream tree via git checkout. We also force
      # CONFIG_KSU_MANUAL_HOOK=y so KSU-Next's Kbuild sees the hooks.
      - name: Restore SLM manual KSU hooks and enable MANUAL_HOOK config
        run: |
          cd device_kernel
          git checkout HEAD -- \
            fs/exec.c fs/stat.c fs/open.c fs/read_write.c fs/namei.c \
            fs/devpts/inode.c drivers/input/input.c drivers/tty/pty.c \
            security/selinux/hooks.c kernel/reboot.c kernel/sys.c
          echo 'CONFIG_KSU_MANUAL_HOOK=y' >> arch/arm64/configs/a32_slm_defconfig

          # v10 fix: SLM does NOT pre-bake a setresuid hook. SukiSU-Ultra
          # builtin's hook/lsm_hook.c gates the LSM task_fix_setuid hook
          # behind #ifndef CONFIG_KSU_SUSFS — meaning when SUSFS is ON,
          # the LSM hook is not registered AND no other call site exists
          # for ksu_handle_setresuid. Result: manager APK never gets the
          # FD installed, every manager reports "unsupported".
          # Fix: inject a manual call at the top of SYSCALL_DEFINE3(setresuid)
          # in kernel/sys.c, matching SLM's manual-hook pattern.
          python3 <<'PYEOF'
          import re
          p = "kernel/sys.c"
          src = open(p).read()

          # Inject right after the SYSCALL_DEFINE3(setresuid, ...) opening brace
          src, n = re.subn(
              r'(SYSCALL_DEFINE3\(setresuid, uid_t, ruid, uid_t, euid, uid_t, suid\)\s*\n\{\n)',
              r'\1'
              r'#ifdef CONFIG_KSU\n'
              r'\textern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n'
              r'\tksu_handle_setresuid(ruid, euid, suid);\n'
              r'#endif\n',
              src, count=1)
          assert n == 1, "setresuid hook injection failed"

          open(p, 'w').write(src)
          print("[+] ksu_handle_setresuid hook injected into SYSCALL_DEFINE3(setresuid)")
          PYEOF

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
